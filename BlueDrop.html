<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BlueDrop</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><style>@import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');:root{--blue:#1677ff;--ink:#102a43;--bg:#f4f8fb;--green:#19b47a;--muted:#61778a}*{box-sizing:border-box}body{margin:0;background:#dbe8f0;font-family:Pretendard,Arial,sans-serif;color:var(--ink)}button,input,select{font:inherit}button{border:0;cursor:pointer}#app{max-width:980px;min-height:100vh;margin:auto;background:var(--bg);padding-bottom:76px}.page{padding:28px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}.logo{font-weight:900;font-size:25px;letter-spacing:-1.5px;color:var(--blue)}.logo i{font-style:normal;color:#1ec2c7}.lang{padding:9px;border:1px solid #bcd6ed;border-radius:12px;background:#fff;color:#176bd4;font-weight:750}.hero{background:linear-gradient(125deg,#073d85,#137ce8,#35c9c9);color:#fff;border-radius:25px;padding:30px}.hero h1{font-size:33px;line-height:1.2;margin:6px 0 19px;letter-spacing:-2px}.hero p{margin:0;opacity:.9}.label{font-size:13px;font-weight:800;margin:21px 0 8px}.chips{display:flex;gap:8px;flex-wrap:wrap}.chip{padding:10px 13px;min-height:43px;border:1px solid #c7dae7;background:#fff;border-radius:22px;color:#4d6779;font-size:13px}.chip.on{background:#e8f3ff;color:#0869dc;border-color:#65aafa;font-weight:800}.field{width:100%;min-height:45px;border:1px solid #ccdde9;border-radius:13px;background:#fff;padding:11px;margin-top:9px}.card{background:#fff;border:1px solid #e2ebf1;border-radius:18px;padding:16px;box-shadow:0 4px 15px #103a5c0a}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:13px}.place h3{margin:9px 0 4px}.small{font-size:12px;color:var(--muted);line-height:1.55}.badge{display:inline-block;padding:5px 8px;border-radius:10px;background:#e8f8f1;color:#16865e;font-size:11px;font-weight:800}.badge.warn{background:#fff1df;color:#ae6b00}.primary{background:var(--blue);color:#fff;border-radius:13px;min-height:45px;padding:10px 14px;font-weight:800}.secondary{background:#eaf4ff;color:#0869dc;border-radius:13px;min-height:43px;padding:10px 13px;font-weight:800}.section{margin-top:25px}.map{height:430px;border-radius:20px;overflow:hidden}.nav{position:fixed;z-index:1000;bottom:0;left:50%;transform:translateX(-50%);width:min(980px,100%);height:70px;display:flex;justify-content:space-around;background:#fff;border-top:1px solid #dce6ed;padding:7px}.nav button{background:none;color:#718799;font-size:11px;min-width:57px}.nav b{display:block;font-size:19px}.nav .on{color:var(--blue);font-weight:800}.route-head{background:#0e406f;color:#fff;border-radius:16px;padding:15px;margin:14px 0}.route-map{height:355px;border-radius:18px;overflow:hidden}.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}.metric{background:#edf4f8;padding:11px;border-radius:12px;font-size:11px;color:var(--muted)}.metric b{display:block;color:var(--ink);font-size:15px;margin-top:4px}.mission{display:flex;gap:12px;align-items:center}.mission-icon{font-size:25px;width:47px;height:47px;border-radius:14px;display:grid;place-items:center;background:#e9f8f1}.mission main{flex:1}.mission h3{margin:0;font-size:15px}.mission p{margin:5px 0 0}.trash{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:14px 0}.trash button{text-align:left;background:#fff;border:1px solid #d9e6ed;border-radius:14px;padding:13px;min-height:62px;color:#38576d}.trash b{float:right;color:var(--blue);font-size:18px}.progress{height:9px;background:#e4edf2;border-radius:8px;overflow:hidden;margin:12px 0}.progress i{display:block;height:100%;background:#20b980}.coupon{display:flex;gap:11px;align-items:center;border-top:1px solid #e6edf3;padding:12px 0}.coupon:first-of-type{border:0}.coupon-icon{font-size:22px;background:#e7f3ff;border-radius:12px;padding:9px}.toast{position:fixed;z-index:9999;bottom:90px;left:50%;transform:translateX(-50%);background:#102a43;color:#fff;padding:12px 16px;border-radius:13px;font-size:13px}.zone{border-radius:50%;width:30px;height:30px;border:3px solid #fff;text-align:center;padding-top:5px;font-size:10px;font-weight:900;color:#fff}.z-good{background:#18a875}.z-warn{background:#e8a42c}.z-bad{background:#e04b4b}@media(max-width:620px){.page{padding:18px}.hero{padding:24px 20px}.hero h1{font-size:28px}.grid{grid-template-columns:1fr}.map{height:380px}.route-map{height:310px}} </style></head><body><div id="app"></div><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>
const places=[{id:'gwang',name:'광안리 해변',district:'수영구',lat:35.1533,lng:129.1187,clean:48,moods:['바다','야경','카페']},{id:'milla',name:'민락수변공원',district:'수영구',lat:35.1548,lng:129.1245,clean:73,moods:['바다','산책','조용']},{id:'hae',name:'해운대 해변',district:'해운대구',lat:35.1587,lng:129.1604,clean:66,moods:['바다','사진','카페']},{id:'song',name:'송정 죽도공원',district:'해운대구',lat:35.1783,lng:129.2012,clean:82,moods:['바다','조용','산책']},{id:'yeong',name:'흰여울문화마을',district:'영도구',lat:35.0785,lng:129.0444,clean:44,moods:['골목','사진','산책']},{id:'dada',name:'다대포 해변',district:'사하구',lat:35.0471,lng:128.9653,clean:61,moods:['노을','바다','산책']},{id:'jeon',name:'전포 카페거리',district:'부산진구',lat:35.1573,lng:129.0641,clean:70,moods:['카페','비오는 날','사진']},{id:'gam',name:'감천문화마을',district:'사하구',lat:35.0983,lng:129.0105,clean:52,moods:['골목','사진','산책']}];
const defaultState={view:'home',mood:'바다',time:'1시간',lang:'ko',destination:'gwang',originText:'부산역',origin:null,drops:80,coupons:[],missionsDone:[],session:null};let S=Object.assign({},defaultState,JSON.parse(localStorage.getItem('bluedrop-clean')||'{}'));function save(){localStorage.setItem('bluedrop-clean',JSON.stringify(S))}const T={ko:{home:'홈',map:'지도',route:'루트',plog:'플로깅',my:'마이',title:'오늘, 어떤 부산을 찾고 있나요?',mood:'원하는 분위기',time:'이동 가능한 시간',results:'추천 장소',origin:'출발 위치',destination:'도착 위치',start:'안내 시작',rewards:'리워드 교환',wallet:'쿠폰함'},en:{home:'Home',map:'Map',route:'Route',plog:'Plogging',my:'My',title:'What kind of Busan are you looking for?',mood:'Mood',time:'Available time',results:'Recommended places',origin:'Start',destination:'Destination',start:'Start route',rewards:'Rewards',wallet:'Coupon wallet'},zh:{home:'首页',map:'地图',route:'路线',plog:'环保任务',my:'我的',title:'今天想去怎样的釜山？',mood:'氛围',time:'可用时间',results:'推荐地点',origin:'出发地',destination:'目的地',start:'开始导航',rewards:'兑换奖励',wallet:'优惠券'},ja:{home:'ホーム',map:'地図',route:'ルート',plog:'プロギング',my:'マイ',title:'今日はどんな釜山を探しますか？',mood:'雰囲気',time:'移動時間',results:'おすすめの場所',origin:'出発地',destination:'目的地',start:'案内開始',rewards:'報酬交換',wallet:'クーポン'}};function t(k){return T[S.lang][k]||T.ko[k]}function go(v){S.view=v;save();render()}function header(){return `<header class="top"><button class="logo" onclick="go('home')">Blue<i>Drop</i></button><select class="lang" onchange="S.lang=this.value;save();render()"><option value="ko" ${S.lang==='ko'?'selected':''}>한국어</option><option value="en" ${S.lang==='en'?'selected':''}>English</option><option value="zh" ${S.lang==='zh'?'selected':''}>中文</option><option value="ja" ${S.lang==='ja'?'selected':''}>日本語</option></select></header>`}function nav(){let x=[['home','⌂','home'],['map','⌖','map'],['route','⌁','route'],['plog','♻','plog'],['my','☺','my']];return `<nav class="nav">${x.map(a=>`<button class="${S.view===a[0]?'on':''}" onclick="go('${a[0]}')"><b>${a[1]}</b>${t(a[2])}</button>`).join('')}</nav>`}function score(p){let m=S.customMood||S.mood,match=p.moods.some(x=>m.includes(x)||x.includes(m));let max={'15분':55,'30분':65,'1시간':75,'2시간':100}[S.time]||75;return (match?50:0)+p.clean-(p.clean>max?12:0)}function selected(p){S.destination=p.id;S.view='route';save();render()}function home(){let moods=['바다','노을','사진','조용한 산책','카페','비오는 날','골목','아이와 함께','반려동물'],times=['15분','30분','1시간','2시간'];let list=[...places].sort((a,b)=>score(b)-score(a)).slice(0,3);return `<main class="page">${header()}<section class="hero"><p>Blue Pulse · 부산의 지금</p><h1>${t('title')}</h1><div class="label">${t('mood')}</div><div class="chips">${moods.map(m=>`<button class="chip ${S.mood===m?'on':''}" onclick="S.mood='${m}';S.customMood='';save();render()">${m}</button>`).join('')}</div><input class="field" placeholder="기타: 원하는 분위기를 직접 입력" value="${S.customMood||''}" onchange="S.customMood=this.value;save();render()"><div class="label">${t('time')}</div><div class="chips">${times.map(x=>`<button class="chip ${S.time===x?'on':''}" onclick="S.time='${x}';save();render()">${x}</button>`).join('')}</div><input class="field" placeholder="기타: 예) 45분, 오후 6시 이후" value="${S.customTime||''}" onchange="S.customTime=this.value;save();render()"></section><section class="section"><h2>${t('results')}</h2><div class="grid">${list.map(p=>`<article class="card place"><span class="badge ${p.clean<55?'warn':''}">청정도 ${p.clean}</span><h3>${p.name}</h3><p class="small">${p.district} · ${p.moods.join(' · ')}</p><p class="small">선택한 분위기와 이동 시간을 반영한 추천</p><button class="primary" style="width:100%" onclick="selected(places.find(x=>x.id==='${p.id}'))">${t('start')}</button></article>`).join('')}</div></section></main>${nav()}`}
let mainMap;function mapPage(){return `<main class="page">${header()}<h1>${t('map')} · Blue Pulse</h1><p class="small">색상은 관광지 주변 청정도를 뜻합니다. 장소를 누르면 도착지로 설정됩니다.</p><div id="mainMap" class="map"></div></main>${nav()}`}function initMap(){setTimeout(()=>{mainMap=L.map('mainMap').setView([35.13,129.09],12);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OpenStreetMap'}).addTo(mainMap);places.forEach(p=>{let c=p.clean<55?'z-bad':p.clean<70?'z-warn':'z-good',i=L.divIcon({className:'',html:`<div class="zone ${c}">${p.clean}</div>`,iconSize:[30,30]});L.marker([p.lat,p.lng],{icon:i}).addTo(mainMap).bindPopup(`<b>${p.name}</b><br>청정도 ${p.clean}<br><button onclick="selected(places.find(x=>x.id==='${p.id}'))">이곳으로 안내</button>`)});},0)}
let routeMap,routeLine;async function resolve(text){let p=places.find(x=>x.name===text)|| (text==='부산역'?{name:'부산역',lat:35.1151,lng:129.0414}:null);if(p)return p;let r=await fetch('https://nominatim.openstreetmap.org/search?format=jsonv2&limit=1&q='+encodeURIComponent(text+' 부산'));let d=await r.json();if(!d.length)throw Error();return{name:d[0].display_name,lat:+d[0].lat,lng:+d[0].lon}}async function plan(){let note=document.getElementById('routeNote'),o=S.origin,d=places.find(x=>x.id===S.destination);if(!o)return;note.textContent='실제 도로 경로를 계산 중…';try{let r=await fetch(`https://router.project-osrm.org/route/v1/driving/${o.lng},${o.lat};${d.lng},${d.lat}?overview=full&geometries=geojson`),x=await r.json(),a=x.routes[0],pts=a.geometry.coordinates.map(c=>[c[1],c[0]]);if(routeLine)routeMap.removeLayer(routeLine);let col=S.mode==='car'?'#ed702c':S.mode==='subway'?'#6d56d9':'#1677ff';routeLine=L.polyline(pts,{color:col,weight:7,dashArray:S.mode==='subway'?'11 8':null}).addTo(routeMap);routeMap.fitBounds(routeLine.getBounds(),{padding:[32,32]});let car=Math.round(a.duration/60),eta=S.mode==='car'?car:S.mode==='walk'?Math.round(car*4.8):Math.round(car*2+7);note.textContent=`${(a.distance/1000).toFixed(1)}km · 예상 ${eta}분 · 실제 도로망 경로`;document.getElementById('eta').textContent=eta+'분'}catch(e){note.textContent='도로 경로를 불러오지 못했습니다. 인터넷 연결 후 다시 시도해 주세요.'}}function routePage(){let d=places.find(x=>x.id===S.destination),m=S.mode||'walk';return `<main class="page">${header()}<h1>${t('route')}</h1><div class="card"><label class="label">${t('origin')}</label><div style="display:flex;gap:8px"><input id="origin" list="origins" class="field" style="margin:0" value="${S.originText||''}" placeholder="예: 부산역, 해운대 해변"><datalist id="origins">${places.map(p=>`<option value="${p.name}">`).join('')}</datalist><button class="primary" onclick="setOrigin()">${t('start')}</button></div><p class="small">${t('destination')} · <b>${d.name}</b></p></div><div class="chips" style="margin:13px 0">${[['walk','🚶 '+t('walk')],['car','🚗 '+t('car')],['subway','🚇 '+t('subway')]].map(x=>`<button class="chip ${m===x[0]?'on':''}" onclick="S.mode='${x[0]}';save();plan()">${x[1]}</button>`).join('')}</div><div class="route-head" id="routeNote">출발 위치를 입력한 뒤 안내 시작을 눌러 주세요.</div><div id="routeMap" class="route-map"></div><div class="metrics"><div class="metric">${t('destination')}<b>${d.name}</b></div><div class="metric">${t('time')}<b id="eta">계산 중</b></div><div class="metric">청정도<b>${d.clean}</b></div></div></main>${nav()}`}function initRoute(){setTimeout(()=>{let d=places.find(x=>x.id===S.destination);routeMap=L.map('routeMap').setView([d.lat,d.lng],13);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OpenStreetMap'}).addTo(routeMap);L.marker([d.lat,d.lng]).addTo(routeMap).bindPopup('도착 · '+d.name).openPopup();if(S.origin)plan()},0)}async function setOrigin(){let v=document.getElementById('origin').value.trim();if(!v)return toast('출발 위치를 입력해 주세요.');try{S.origin=await resolve(v);S.originText=v;save();L.marker([S.origin.lat,S.origin.lng]).addTo(routeMap).bindPopup('출발 · '+S.origin.name).openPopup();plan()}catch(e){toast('출발 위치를 찾지 못했습니다.')}}
function missions(){return [{id:'p1',place:'gwang',title:'해안 플라스틱 5개 줍기',type:'플라스틱',goal:5,reward:20},{id:'p2',place:'hae',title:'캔 3개 분리배출하기',type:'캔',goal:3,reward:20},{id:'p3',place:'yeong',title:'골목 담배꽁초 10개 수거',type:'담배꽁초',goal:10,reward:25}]}function plog(){if(S.session)return session();return `<main class="page">${header()}<h1>${t('plog')} Mission</h1><p class="small">관광지로 이동하며 10분 안팎의 작은 실천을 해보세요.</p><div class="section">${missions().map(m=>{let p=places.find(x=>x.id===m.place);return `<article class="card mission" style="margin-bottom:11px"><div class="mission-icon">♻</div><main><h3>${m.title}</h3><p class="small">${p.name} · ${m.type} · +${m.reward} Drop</p></main><button class="primary" onclick="accept('${m.id}')">수락</button></article>`}).join('')}</div></main>${nav()}`}function accept(id){let m=missions().find(x=>x.id===id);S.session={id,counts:{플라스틱:0,캔:0,담배꽁초:0,기타:0},photo:false};S.destination=m.place;S.view='route';save();render()}function session(){let s=S.session,m=missions().find(x=>x.id===s.id),n=Object.values(s.counts).reduce((a,b)=>a+b,0);return `<main class="page">${header()}<span class="badge">진행 중</span><h1>${m.title}</h1><div class="card"><b>${n} / ${m.goal}개 수거</b><div class="progress"><i style="width:${Math.min(100,n/m.goal*100)}%"></i></div><p class="small">목표 달성 후 사진을 등록하면 Mock AI 인증이 진행됩니다.</p></div><div class="trash">${Object.keys(s.counts).map(x=>`<button onclick="S.session.counts['${x}']++;save();render()">${x}<b>+1</b><small>현재 ${s.counts[x]}개</small></button>`).join('')}</div><label class="secondary" style="display:block;text-align:center">${s.photo?'✓ 사진 등록됨':'📷 수거 사진 등록'}<input type="file" style="display:none" accept="image/*" onchange="S.session.photo=!!this.files[0];save();render()"></label><button class="primary" style="width:100%;margin-top:12px" onclick="verify()">인증하고 보상 받기</button></main>${nav()}`}function verify(){let s=S.session,m=missions().find(x=>x.id===s.id),n=Object.values(s.counts).reduce((a,b)=>a+b,0);if(n<m.goal)return toast('목표 수량을 더 기록해 주세요.');if(!s.photo)return toast('수거 사진을 등록해 주세요.');let p=places.find(x=>x.id===m.place);S.drops+=m.reward;p.clean=Math.min(100,p.clean+4);S.coupons.push('해변 카페 10% 할인');S.missionsDone.push(m.id);S.session=null;save();toast('인증 승인! +'+m.reward+' Drop, 쿠폰이 발급됐어요.');go('my')}
function my(){return `<main class="page">${header()}<h1>${t('my')}</h1><div class="card"><b style="font-size:26px;color:var(--blue)">💧 ${S.drops} Drop</b><p class="small">완료 미션 ${S.missionsDone.length}개 · 지금 리워드로 교환할 수 있어요.</p><button class="primary" onclick="go('rewards')">${t('rewards')}</button></div><section class="section"><h2>${t('wallet')}</h2><div class="card">${S.coupons.length?S.coupons.map(c=>`<div class="coupon"><span class="coupon-icon">🎟</span><div style="flex:1"><b>${c}</b><p class="small">BlueDrop 보상 쿠폰 · 사용 가능</p></div></div>`).join(''):'<p class="small">받은 쿠폰이 없습니다. 플로깅 미션을 완료하거나 Drop으로 교환해 보세요.</p>'}</div></section></main>${nav()}`}function rewards(){let items=[['☕ 해변 카페 음료 10% 할인',40],['🥤 편의점 음료 1,000원 할인',60],['🍪 로컬 베이커리 쿠키 증정',90],['🎁 부산 관광 굿즈 15% 할인',150]];return `<main class="page">${header()}<h1>${t('rewards')}</h1><div class="card"><b style="font-size:26px;color:var(--blue)">💧 ${S.drops} Drop</b><p class="small">교환한 쿠폰은 마이의 쿠폰함에서 확인할 수 있어요.</p></div><div class="section">${items.map(x=>`<div class="card coupon"><span class="coupon-icon">🎁</span><div style="flex:1"><b>${x[0]}</b><p class="small">${x[1]} Drop 필요</p></div><button class="primary" ${S.drops<x[1]?'disabled':''} onclick="redeem(${x[1]},'${x[0]}')">${t('rewards')}</button></div>`).join('')}</div></main>${nav()}`}function redeem(cost,name){if(S.drops<cost)return;S.drops-=cost;S.coupons.push(name);save();toast('쿠폰을 발급했습니다. 마이 > 쿠폰함에서 확인하세요.');render()}function toast(x){let d=document.createElement('div');d.className='toast';d.textContent=x;document.body.append(d);setTimeout(()=>d.remove(),2600)}function render(){let view={home,map:mapPage,route:routePage,plog,my,rewards}[S.view]||home;document.getElementById('app').innerHTML=view();if(S.view==='map')initMap();if(S.view==='route')initRoute()}render();
