<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>BlueDrop | 부산의 흐름을 따라</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><style>@import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');:root{--ink:#102a43;--blue:#1677ff;--mint:#19b47a;--bg:#f4f8fb;--line:#dfe9f0;--sub:#61778a}*{box-sizing:border-box}body{margin:0;background:#dce8ef;font-family:Pretendard,Arial,sans-serif;color:var(--ink)}button,input,select,textarea{font:inherit}button{cursor:pointer;border:0}#app{max-width:1120px;min-height:100vh;margin:auto;background:var(--bg);padding-bottom:75px}.page{padding:28px;animation:show .25s ease}@keyframes show{from{opacity:.3;transform:translateY(7px)}to{opacity:1;transform:none}}.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:25px}.logo{font-size:24px;font-weight:900;letter-spacing:-1.5px;color:var(--blue)}.logo i{color:#23c0ca;font-style:normal}.live{font-size:12px;background:#e7f8f2;color:#16895f;border-radius:20px;padding:8px 11px;font-weight:750}.live:before{content:'●';margin-right:5px}.intro{background:linear-gradient(118deg,#073f87,#117cf0 53%,#42cfdb);color:#fff;padding:38px;border-radius:28px;position:relative;overflow:hidden}.intro:after{content:'';position:absolute;width:650px;height:180px;right:-180px;bottom:-120px;border-radius:50%;background:#b8fff975}.intro>*{position:relative;z-index:1}.intro h1{font-size:clamp(27px,4vw,42px);letter-spacing:-2.5px;line-height:1.18;max-width:630px;margin:6px 0 23px}.intro p{opacity:.87;margin:0;font-size:15px}.choice-title{font-size:13px;font-weight:750;margin:25px 0 10px}.chips{display:flex;gap:8px;flex-wrap:wrap}.chip{min-height:44px;border:1px solid #c6d9e6;background:#fff;border-radius:22px;padding:8px 13px;color:#466277;font-size:13px}.chip.on{background:#e5f2ff;border-color:#62a8fa;color:#0964de;font-weight:750}.primary{min-height:48px;background:var(--blue);color:#fff;border-radius:14px;padding:12px 18px;font-weight:750}.primary:disabled{background:#a9bccd}.results{margin-top:26px}.section-title{font-size:20px;letter-spacing:-1px;margin:0 0 12px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.card{background:#fff;border:1px solid #e5edf2;border-radius:19px;padding:18px;box-shadow:0 5px 17px #143f6108}.place{position:relative;text-align:left}.place h3{font-size:17px;margin:9px 0 4px}.place p{margin:0;color:var(--sub);font-size:12px;line-height:1.5}.score{display:inline-flex;gap:5px;align-items:center;border-radius:8px;padding:5px 7px;font-size:11px;font-weight:800}.low{background:#e8f8f0;color:#12845c}.mid{background:#fff4db;color:#a76b04}.high{background:#ffe8e7;color:#d64038}.reason{padding-top:11px;margin-top:11px;border-top:1px solid var(--line);font-size:12px;color:#486176}.place .actions{display:flex;gap:7px;margin-top:14px}.soft{min-height:42px;border-radius:12px;background:#eaf4ff;color:#126de7;padding:8px 11px;font-size:12px;font-weight:750}.map-page{padding:0;min-height:calc(100vh - 75px);position:relative}.map-head{position:absolute;z-index:700;top:18px;left:18px;right:18px;display:flex;gap:9px}.map-head .search{flex:1;background:#fff;border-radius:14px;padding:13px 14px;box-shadow:0 4px 15px #12456d24;font-size:14px}.round{width:46px;height:46px;background:white;border-radius:14px;box-shadow:0 4px 15px #12456d24;font-size:18px}.map{height:calc(100vh - 75px);min-height:580px;background:#d9e8e3}.map-tools{position:absolute;right:18px;top:83px;z-index:700;display:grid;gap:7px}.map-tools button{width:43px;height:43px;background:#fff;border-radius:12px;box-shadow:0 3px 11px #174d7425}.map-sheet{position:absolute;z-index:700;bottom:16px;left:18px;right:18px;max-width:520px}.sheet{padding:18px}.sheet h2{margin:2px 0 5px;font-size:19px}.muted{color:var(--sub);font-size:13px}.metrics{display:flex;gap:8px;margin:13px 0}.metric{flex:1;background:#f2f7fa;border-radius:12px;padding:10px;font-size:11px;color:var(--sub)}.metric b{display:block;color:var(--ink);font-size:14px;margin-top:3px}.suggest{margin-top:13px;padding:12px;border-radius:13px;background:#edfbf5;font-size:13px}.tabs{display:flex;border-bottom:1px solid var(--line);margin-bottom:20px;gap:18px}.tabs button{background:none;padding:12px 3px;color:var(--sub);font-weight:700}.tabs .on{color:var(--blue);border-bottom:3px solid var(--blue)}.route{display:grid;grid-template-columns:1fr 1fr;gap:16px}.route-card h3{margin:8px 0;font-size:17px}.route-card p{font-size:13px;color:var(--sub);line-height:1.55}.route-card.selected{border:2px solid #69aaf7}.bar{height:7px;background:#e6edf2;border-radius:5px;overflow:hidden;margin:10px 0}.bar i{display:block;height:100%;background:#27b987;border-radius:5px}.report-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.report-option{min-height:69px;text-align:left;background:#fff;border:1px solid var(--line);border-radius:15px;padding:12px;font-size:13px;color:#3b586d}.report-option.on{border:2px solid var(--blue);background:#eaf4ff;color:#075ecb;font-weight:750}.field{width:100%;border:1px solid var(--line);border-radius:14px;padding:13px;background:#fff;resize:vertical}.mygrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.stat{text-align:center;padding:17px 8px}.stat b{font-size:23px;color:#0970ec;display:block}.stat span{font-size:11px;color:var(--sub)}.activity{margin-top:14px;display:flex;gap:12px}.activity .dot{width:38px;height:38px;background:#e5f4ff;border-radius:50%;display:grid;place-items:center}.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);height:69px;width:min(1120px,100%);z-index:1000;display:flex;justify-content:space-around;background:#fff;border-top:1px solid #dfe8ef;padding:6px}.nav button{background:none;min-width:63px;font-size:11px;color:#718698}.nav b{display:block;font-size:19px;margin-bottom:2px}.nav .on{color:var(--blue);font-weight:800}.toast{position:fixed;z-index:3000;left:50%;bottom:87px;transform:translateX(-50%);background:#102a43;color:#fff;border-radius:14px;padding:13px 17px;box-shadow:0 6px 20px #102a4350;font-size:13px;max-width:90%;text-align:center}.pin{border-radius:50%;width:34px!important;height:34px!important;display:grid;place-items:center;background:#fff;border:3px solid #1aa86c;color:#123;font-weight:900;box-shadow:0 3px 10px #1235}.pin.mid{border-color:#efa51a}.pin.high{border-color:#e44945}.pin b{font-size:10px}.leaflet-popup-content-wrapper{border-radius:13px}.leaflet-popup-content{font-family:Pretendard,Arial,sans-serif;margin:12px}.empty{padding:28px;text-align:center;color:var(--sub)}@media(max-width:620px){.page{padding:19px}.intro{padding:26px 20px;border-radius:23px}.intro h1{font-size:28px}.grid{grid-template-columns:1fr}.mygrid{grid-template-columns:repeat(2,1fr)}.route{grid-template-columns:1fr}.map-head{top:12px;left:12px;right:12px}.map-sheet{left:12px;right:12px;bottom:9px}.map{height:calc(100vh - 69px)}}@media(min-width:850px){.page{padding:38px 52px}.intro{padding:48px}.report-grid{grid-template-columns:repeat(3,1fr)}} </style></head><body><div id="app"></div><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>
const base=[['송정 죽도공원','해운대구',35.178,129.201,18,'조용한 바다, 산책'],['청사포 다릿돌전망대','해운대구',35.159,129.191,31,'사진, 바다'],['미포철길','해운대구',35.160,129.166,44,'사진, 걷기'],['광안리 해변','수영구',35.153,129.118,82,'야경, 카페'],['민락수변공원','수영구',35.154,129.124,24,'바다, 걷기'],['이기대 해안산책로','남구',35.126,129.124,29,'조용한, 걷기'],['흰여울문화마을','영도구',35.079,129.044,64,'사진, 골목'],['송도 구름산책로','서구',35.078,129.020,37,'바다, 사진'],['감천문화마을','사하구',35.098,129.010,72,'골목, 사진'],['다대포 해변','사하구',35.047,128.965,33,'노을, 바다'],['온천천 산책길','동래구',35.201,129.081,21,'걷기, 조용한'],['전포 카페거리','부산진구',35.157,129.064,59,'카페, 비오는 날'],['북항 친수공원','동구',35.118,129.046,38,'바다, 산책'],['오륙도 스카이워크','남구',35.099,129.121,54,'바다, 사진']];
const extras=['해운대 달맞이길','청사포 포구','송정 해변','기장 죽성성당','일광 해변','대변항','오시리아 산책길','수영강 카페길','망미단길','남천동 벚꽃길','용호만 산책로','태종대 전망대','영도 봉래산','초량 이바구길','부평깡통시장','국제시장 골목','용두산공원','범어사 숲길','금정산성마을','부산시민공원','삼락생태공원','을숙도 철새공원','암남공원','송도 해상케이블카','절영해안산책로','다대포 꿈의낙조분수','아미동 비석문화마을','수정산 가족체육공원','문현금융단지','광복로 문화거리','부산역 북항길','동백섬 산책로','해리단길','반송시장','명지 생태공원','가덕도 대항마을','천성항','연산교차로 카페','동래읍성','금강공원','장전동 골목','부산대 앞 거리','사상 삼락노을길','괴정천 산책로','신평역 벽화길','구포시장','화명생태공원','덕천 로컬거리','다송해변','기장 연화리'];
const places=[...base,...extras.map((n,i)=>[n,['기장군','금정구','중구','사상구','북구'][i%5],35.05+(i%14)*.011,128.96+(i%12)*.018,15+(i*11)%70,['산책','조용한','카페','사진','비오는 날'][i%5]])].map((x,i)=>({id:'p'+i,name:x[0],district:x[1],lat:x[2],lng:x[3],base:x[4],moods:x[5].split(',')}));
let S=JSON.parse(localStorage.getItem('bluedrop-live')||'{"mood":"조용한, 걷기","time":"30분","reports":[],"saved":[],"route":null,"view":"home"}');let map,markers=[];const timeValue=()=>S.time==='15분'?15:S.time==='30분'?30:S.time==='1시간'?60:120;function save(){localStorage.setItem('bluedrop-live',JSON.stringify(S))}function pressure(p){let h=new Date().getHours(),week=[0,6].includes(new Date().getDay());let v=p.base+(week?8:0)+(h>=18&&p.moods.some(x=>x.includes('야경')||x.includes('사진'))?10:0);S.reports.filter(r=>r.placeId===p.id&&Date.now()-r.at<7200000).forEach(r=>{if(['사람이 많아요','대기 시간이 길어요','주차가 어려워요'].includes(r.type))v+=5;if(['조용해요','쓰레기 거의 없어요'].includes(r.type))v-=3});return Math.max(0,Math.min(100,Math.round(v)))}function label(v){return v<=25?'매우 여유':v<=45?'여유':v<=65?'보통':v<=80?'혼잡':'매우 혼잡'}function cls(v){return v<=45?'low':v<=65?'mid':'high'}function appHeader(){return `<header class="top"><button class="logo" onclick="go('home')">Blue<i>Drop</i></button><span class="live">실시간 상태 반영 중</span></header>`}function nav(){return `<nav class="nav">${[['home','⌂','홈'],['map','⌖','지도'],['routes','⌁','루트'],['report','♻','플로깅'],['my','☺','마이']].map(x=>`<button class="${S.view===x[0]?'on':''}" onclick="go('${x[0]}')"><b>${x[1]}</b>${x[2]}</button>`).join('')}</nav>`}function go(v){S.view=v;history.pushState({view:v},'',`#${v}`);save();render();window.scrollTo(0,0)}window.addEventListener('popstate',e=>{S.view=e.state?.view||location.hash.slice(1)||'home';save();render()});function pickMood(m,e){S.mood=m;document.querySelectorAll('.mood').forEach(x=>x.classList.remove('on'));e.classList.add('on');save()}function pickTime(t,e){S.time=t;document.querySelectorAll('.time').forEach(x=>x.classList.remove('on'));e.classList.add('on');save()}function rec(){let words=S.mood.split(',');return [...places].map(p=>({p,score:words.filter(w=>p.moods.some(x=>x.includes(w)||w.includes(x))).length*35+(100-pressure(p))*.45-Math.max(0,p.base-timeValue())*.08})).sort((a,b)=>b.score-a.score).slice(0,3).map(x=>x.p)}
function home(){let moods=['사람이 적은 바다','노을이 예쁜 곳','사진이 잘 나오는 곳','조용히 걷기 좋은 길','이색적인 카페','비 오는 날 가기 좋은 곳','1시간 안에 즐길 곳','대중교통이 편한 곳'];return `<main class="page">${appHeader()}<section class="intro"><p>부산의 지금을 읽는 여행</p><h1>오늘, 어떤 부산을<br>찾고 있나요?</h1><div class="choice-title">원하는 분위기</div><div class="chips">${moods.map(m=>`<button class="chip mood ${S.mood.includes(m.split(' ')[0])?'on':''}" onclick="pickMood('${m.includes('바다')?'바다':m.includes('노을')?'노을':m.includes('사진')?'사진':m.includes('걷기')?'조용한, 걷기':m.includes('카페')?'카페':m.includes('비')?'비오는 날':m.includes('1시간')?'산책':'대중교통'}',this)">${m}</button>`).join('')}</div><div class="choice-title">이동 가능한 시간</div><div class="chips">${['15분','30분','1시간','상관 없음'].map(t=>`<button class="chip time ${S.time===t?'on':''}" onclick="pickTime('${t}',this)">${t}</button>`).join('')}</div></section><section class="results"><h2 class="section-title">지금 조건에 맞는 3곳</h2><div class="grid">${rec().map(placeCard).join('')}</div></section></main>${nav()}`}function placeCard(p){let q=pressure(p),reports=S.reports.filter(r=>r.placeId===p.id&&Date.now()-r.at<7200000).length;return `<article class="card place"><span class="score ${cls(q)}">혼잡 ${q} · ${label(q)}</span><h3>${p.name}</h3><p>${p.district} · ${p.moods.join(' · ')}</p><div class="reason">${q<46?'사람이 몰리지 않아 지금 걷기 좋아요.':'최근 제보를 반영한 현재 상태예요.'}<br>최근 2시간 제보 ${reports}건 · 예상 이동 ${Math.min(42,12+p.base/3|0)}분</div><div class="actions"><button class="soft" onclick="showPlace('${p.id}')">지도에서 보기</button><button class="primary" style="flex:1" onclick="startRoute('${p.id}')">우회 루트</button></div></article>`}
function mapView(){return `<main class="map-page"><div id="map" class="map"></div><div class="map-head"><input class="search" placeholder="장소 또는 지역 검색" oninput="searchMap(this.value)" aria-label="장소 검색"><button class="round" onclick="locate()" aria-label="현재 위치">◎</button></div><div class="map-tools"><button onclick="map.zoomIn()" aria-label="확대">＋</button><button onclick="map.zoomOut()" aria-label="축소">−</button></div><div id="mapSheet" class="map-sheet"></div></main>${nav()}`}
function initMap(){setTimeout(()=>{map=L.map('map',{zoomControl:false}).setView([35.145,129.06],12);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OpenStreetMap'}).addTo(map);markers=places.map(p=>{let q=pressure(p),ic=L.divIcon({className:'',html:`<div class="pin ${cls(q)}"><b>${q}</b></div>`,iconSize:[34,34],iconAnchor:[17,17]});return L.marker([p.lat,p.lng],{icon:ic}).addTo(map).on('click',()=>showPlace(p.id))});showPlace(rec()[0].id)},0)}function showPlace(id){let p=places.find(x=>x.id===id),q=pressure(p),alt=places.filter(x=>x.id!==id&&pressure(x)<45).slice(0,2);document.getElementById('mapSheet').innerHTML=`<article class="card sheet"><span class="score ${cls(q)}">관광 혼잡 ${q} · ${label(q)}</span><h2>${p.name}</h2><p class="muted">${p.district} · 최근 2시간 제보 ${S.reports.filter(r=>r.placeId===p.id).length}건</p><div class="metrics"><div class="metric">예상 대기<b>${q>65?'18분':'5분'}</b></div><div class="metric">교통 혼잡<b>${q>65?'혼잡':'원활'}</b></div><div class="metric">사진 촬영<b>${q>65?'어려움':'좋음'}</b></div></div>${q>=66?`<div class="suggest">지금은 붐벼요. <b>${alt.map(x=>x.name).join(' · ')}</b>에서 더 여유롭게 시작해 보세요.</div>`:''}<button class="primary" style="width:100%;margin-top:12px" onclick="startRoute('${p.id}')">우회 루트 찾기</button></article>`;if(map)map.flyTo([p.lat,p.lng],14)}function searchMap(v){let p=places.find(p=>p.name.includes(v)||p.district.includes(v));if(p)showPlace(p.id)}function locate(){if(!navigator.geolocation){toast('현재 위치를 사용할 수 없어 부산 중심으로 안내합니다.');return}navigator.geolocation.getCurrentPosition(x=>{map.flyTo([x.coords.latitude,x.coords.longitude],14);toast('현재 위치로 이동했어요.')},()=>{map.flyTo([35.145,129.06],12);toast('위치 권한 없이도 지도를 이용할 수 있어요.')})}
const routes=[['가장 조용한 길',31,2.4,23,82,1,'민락수변공원 · 광안리 해변'],['발견이 많은 길',38,3.1,35,61,2,'남천동 골목 · 민락수변공원'],['대중교통 중심 길',28,2.6,42,58,2,'금련산역 · 민락수변공원']];function startRoute(id){let p=places.find(x=>x.id===id);S.destination=id;S.view='routes';save();render()}function routesView(){let dst=places.find(p=>p.id===S.destination)||places[3];return `<main class="page">${appHeader()}<h1 class="section-title">${dst.name}까지, 어떤 길로 갈까요?</h1><p class="muted" style="margin:-5px 0 17px">빠른 길 대신, 지금의 부산을 더 편하게 걷는 선택이에요.</p><div class="tabs"><button class="on">루트 비교</button><button onclick="go('map')">지도에서 보기</button></div><div class="route">${routes.map((r,i)=>`<article class="card route-card ${i===1?'selected':''}"><span class="score ${i===1?'low':'mid'}">${i===1?'추천':'비교'}</span><h3>${r[0]}</h3><p>${r[6]}</p><div class="bar"><i style="width:${r[4]}%"></i></div><p>예상 ${r[1]}분 · ${r[2]}km<br>평균 혼잡 ${r[3]} · 조용한 구간 ${r[4]}%<br>혼잡 구간 ${r[5]}개 · 발견 포인트 ${i+2}개</p><button class="primary" style="width:100%;margin-top:12px" onclick="chooseRoute(${i})">이 길 선택</button></article>`).join('')}</div></main>${nav()}`}function chooseRoute(i){S.route={i,progress:0};save();go('navigate')}function navigate(){let r=routes[S.route?.i||1];return `<main class="page">${appHeader()}<h1 class="section-title">${r[0]} 진행 중</h1><div class="card" style="margin-bottom:15px;background:linear-gradient(135deg,#d8eff8,#eafaf1)"><div style="height:245px;position:relative;overflow:hidden;border-radius:12px;background:repeating-linear-gradient(35deg,transparent 0 35px,#fff9 37px 40px)"><div style="position:absolute;left:12%;top:70%;right:12%;height:7px;background:#1677ff;border-radius:8px;transform:rotate(-18deg)"></div><span style="position:absolute;left:8%;top:65%;font-size:24px">●</span><span style="position:absolute;right:10%;top:16%;font-size:24px;color:#ef5c50">⌖</span></div><div class="metrics"><div class="metric">다음 지점<b>420m</b></div><div class="metric">남은 시간<b>${r[1]}분</b></div><div class="metric">현재 혼잡<b>${r[3]}</b></div></div></div><div class="card"><b>다음 발견 포인트 · 민락수변공원</b><p class="muted" style="margin-top:5px">바다 쪽 데크를 따라가면 조용한 구간이 이어져요.</p><button class="soft" style="margin-top:12px" onclick="toast('개발용 모드: 다음 지점까지 이동했어요.')">개발용: 다음 지점으로</button><button class="primary" style="float:right" onclick="endRoute()">루트 종료</button></div></main>${nav()}`}function endRoute(){S.route=null;save();go('my')}
function report(){let types=['지금 사람이 많아요','생각보다 조용해요','쓰레기 거의 없어요','대기 시간이 길어요','사진 찍기 좋아요','사진 찍기 어려워요','주차가 어려워요','대중교통이 편해요','조용히 걷기 좋아요','바람이 강해요','화장실이 혼잡해요','현재 깨끗해요'];return `<main class="page">${appHeader()}<h1 class="section-title">지금 이곳은 어떤가요?</h1><p class="muted" style="margin:-5px 0 19px">3초면 충분해요. 이 정보는 2시간 동안 여행자에게 보입니다.</p><select id="reportPlace" class="field">${places.slice(0,25).map(p=>`<option value="${p.id}">${p.name}</option>`).join('')}</select><div class="report-grid" style="margin-top:13px">${types.map(t=>`<button class="report-option" onclick="selectReport('${t}',this)">${t}</button>`).join('')}</div><label class="muted" style="display:block;margin:17px 0 7px">한 줄 추가 (선택)</label><textarea id="reportText" class="field" rows="3" placeholder="예: 해변 입구 쪽에 사람이 모여 있어요."></textarea><button class="primary" id="reportBtn" disabled style="width:100%;margin-top:15px" onclick="sendReport()">제보하기</button></main>${nav()}`}let reportType='';function selectReport(t,e){reportType=t;document.querySelectorAll('.report-option').forEach(x=>x.classList.remove('on'));e.classList.add('on');document.getElementById('reportBtn').disabled=false}function sendReport(){let pid=document.getElementById('reportPlace').value;S.reports.push({placeId:pid,type:reportType,text:document.getElementById('reportText').value,at:Date.now()});save();toast('현장 정보가 반영됐어요. 2시간 동안 다른 여행자에게 표시됩니다.');go('map')}
function my(){let quiet=S.reports.filter(r=>r.type.includes('조용')||r.type.includes('깨끗')).length;return `<main class="page">${appHeader()}<h1 class="section-title">나의 부산 흐름</h1><p class="muted" style="margin-top:-5px">여행이 부산에 남긴 좋은 변화예요.</p><div class="mygrid" style="margin-top:18px"><div class="card stat"><b>${quiet}</b><span>나눠 찾은<br>여유 구간</span></div><div class="card stat"><b>${S.route?1:0}</b><span>선택한<br>조용한 루트</span></div><div class="card stat"><b>${S.reports.length}</b><span>작성한<br>현장 제보</span></div><div class="card stat"><b>${S.saved.length}</b><span>저장한<br>장소</span></div></div><section style="margin-top:24px"><h2 class="section-title">나의 기여</h2><div class="card"><b>더 여유로운 부산 여행에 기여했어요</b><p class="muted" style="margin-top:7px">내 제보가 다른 여행자의 선택에 실시간으로 반영됩니다.</p></div></section><section style="margin-top:19px"><h2 class="section-title">최근 활동</h2>${S.reports.slice(-3).reverse().map(r=>`<div class="card activity"><span class="dot">◎</span><div><b>${places.find(p=>p.id===r.placeId)?.name}</b><p class="muted" style="margin:5px 0 0">${r.type} · 현장 제보를 남겼어요</p></div></div>`).join('')||'<div class="card empty">아직 활동이 없어요. 부산의 지금을 처음 알려주세요.</div>'}</section></main>${nav()}`}function toast(t){let d=document.createElement('div');d.className='toast';d.textContent=t;document.body.append(d);setTimeout(()=>d.remove(),2800)}function render(){document.getElementById('app').innerHTML=({home,map:mapView,routes:routesView,navigate,report,my}[S.view]||home)();if(S.view==='map')initMap()}render();</script>
<script>
(()=>{const css=`.eco{background:linear-gradient(135deg,#073e76,#087d92 55%,#31c489);color:#fff;padding:22px;border-radius:22px}.eco h1{margin:5px 0;font-size:25px}.ek{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:16px}.ek div{background:#ffffff20;border-radius:12px;padding:10px;font-size:11px}.ek b{display:block;font-size:18px}.em{display:grid;gap:11px;margin-top:15px}.em article{padding:16px}.eb{background:#e7f8ef;color:#11865d;border-radius:14px;padding:6px 8px;font-size:11px;font-weight:800}.tg{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:15px 0}.tb{min-height:65px;background:#fff;border:1px solid #dbe8ef;border-radius:15px;text-align:left;padding:12px;color:#315267}.tb b{float:right;color:#0872ec;font-size:18px}.pb{height:10px;background:#e2ecf1;border-radius:9px;overflow:hidden;margin:13px 0}.pb i{height:100%;display:block;background:linear-gradient(90deg,#1fb880,#29c7d1)}.receipt{border:1px dashed #7cc9aa;background:#f4fffa}.receipt dl{display:grid;grid-template-columns:1fr auto;gap:10px;font-size:13px}.receipt dt{color:#60798b}.receipt dd{margin:0;font-weight:800}`;document.head.insertAdjacentHTML('beforeend',`<style>${css}</style>`);
function E(){if(!S.env){S.env={drops:60,zones:{'해운대구':{clean:78,users:7,bonus:1},'수영구':{clean:48,users:12,bonus:1.2},'남구':{clean:70,users:4,bonus:1},'영도구':{clean:43,users:9,bonus:1.2},'사하구':{clean:59,users:5,bonus:1.1}},session:null,done:[],receipt:null};save()}return S.env}function Z(p){let e=E();return e.zones[p.district]||(e.zones[p.district]={clean:64,users:2,bonus:1})}function M(){let e=E();if(e.ms)return e.ms;let t=[['플라스틱',5,20,'해안 산책 중 플라스틱 5개 줍기'],['캔',3,20,'캔 3개 수거해 분리배출하기'],['담배꽁초',10,25,'담배꽁초 10개 수거하기'],['기타',5,22,'관광 포인트까지 걸으며 쓰레기 5개 줍기'],['플라스틱',4,18,'15분 동안 플로깅하기'],['기타',4,24,'다른 여행자가 신고한 쓰레기 해결하기']];e.ms=Array.from({length:30},(_,i)=>{let a=t[(i+new Date().getDate())%6],p=places[i%places.length],z=Z(p);return{id:'eco'+i,title:a[3],type:a[0],goal:a[1],reward:a[2],place:p.id,min:8+i%3*4,impact:3+i%4,bonus:z.bonus}});save();return e.ms}
window.report=function(){let e=E();if(e.receipt)return receipt(e.receipt);if(e.session)return play();let ms=M().filter(m=>!e.done.includes(m.id)).slice(0,4);return `<main class="page">${appHeader()}<section class="eco"><span style="font-size:12px">Blue Pulse · 여행 중 실천</span><h1>걷는 길에서,<br>부산을 더 깨끗하게.</h1><p style="font-size:13px">관광지와 산책 루트 주변의 짧은 플로깅 미션이에요.</p><div class="ek"><div><b>${e.drops}</b>보유 Drop</div><div><b>${e.done.length}</b>완료 미션</div><div><b>${Object.values(e.zones).reduce((a,z)=>a+z.users,0)}</b>참여자</div></div></section><h2 class="section-title" style="margin-top:24px">지금 떠날 수 있는 미션</h2><div class="em">${ms.map(card).join('')}</div></main>${nav()}`};function card(m){let p=places.find(x=>x.id===m.place),z=Z(p);return `<article class="card"><div style="display:flex;justify-content:space-between"><span class="eb">${m.min}분 · ${m.type}</span><b style="color:#0872ec">+${Math.round(m.reward*z.bonus)} Drop</b></div><h3>${m.title}</h3><p class="muted">📍 ${p.name} · 청정도 ${z.clean} · ${z.bonus}배 보너스</p><button class="primary" style="width:100%;margin-top:13px" onclick="acceptEco('${m.id}')">미션 수락하고 출발</button></article>`}
window.acceptEco=id=>{let e=E();e.session={id,at:Date.now(),checked:false,photo:false,distance:0,trash:{'플라스틱':0,'캔':0,'담배꽁초':0,'기타':0}};save();render()};function play(){let e=E(),s=e.session,m=M().find(x=>x.id===s.id),p=places.find(x=>x.id===m.place),z=Z(p),n=Object.values(s.trash).reduce((a,b)=>a+b,0);return `<main class="page">${appHeader()}<span class="eb">진행 중 · ${p.name}</span><h1 class="section-title" style="margin-top:10px">${m.title}</h1><div class="card"><div style="display:flex;justify-content:space-between"><span class="muted">수거 진행률</span><b>${n} / ${m.goal}</b></div><div class="pb"><i style="width:${Math.min(100,n/m.goal*100)}%"></i></div><div class="metrics"><div class="metric">활동 시간<b>${Math.max(1,Math.floor((Date.now()-s.at)/60000))}분</b></div><div class="metric">이동 거리<b>${s.distance}m</b></div><div class="metric">구역 보너스<b>${z.bonus}배</b></div></div></div><div class="tg">${Object.keys(s.trash).map(t=>`<button class="tb" onclick="addTrash('${t}')">${t}<b>+1</b><small>현재 ${s.trash[t]}개</small></button>`).join('')}</div><button class="soft" style="width:100%;margin-top:5px" onclick="checkEco()">${s.checked?'✓ 현장 체크인 완료':'⌖ 현장 체크인하기 (Mock 위치)'}</button><label class="soft" style="display:block;text-align:center;margin-top:10px">${s.photo?'✓ 수거 사진 등록 완료':'📷 수거 사진 등록'}<input type="file" accept="image/*" style="display:none" onchange="photoEco(this)"></label><button class="soft" style="width:100%;margin-top:10px" onclick="moveEco()">개발용: 100m 이동 기록</button><button class="primary" style="width:100%;margin-top:10px" onclick="verifyEco()">Mock AI로 인증하기 · 예상 +${Math.round(m.reward*z.bonus)} Drop</button></main>${nav()}`}
window.resetEco=()=>{E().receipt=null;save();render()};window.addTrash=t=>{E().session.trash[t]++;save();render()};window.checkEco=()=>{E().session.checked=true;save();render()};window.moveEco=()=>{E().session.distance+=100;save();render()};window.photoEco=i=>{if(i.files[0]){E().session.photo=true;save();render()}};window.verifyEco=()=>{let e=E(),s=e.session,m=M().find(x=>x.id===s.id),n=Object.values(s.trash).reduce((a,b)=>a+b,0);if(!s.checked)return toast('먼저 현장 체크인을 해주세요.');if(!s.photo)return toast('수거 사진을 등록해 주세요.');if(n<m.goal)return toast(`목표까지 ${m.goal-n}개 더 기록해 주세요.`);let p=places.find(x=>x.id===m.place),z=Z(p),before=z.clean,reward=Math.round(m.reward*z.bonus);z.clean=Math.min(100,z.clean+m.impact);e.drops+=reward;e.done.push(m.id);e.receipt={m,p,before,after:z.clean,reward,n,dist:s.distance};e.session=null;save();render()};function receipt(r){return `<main class="page">${appHeader()}<section class="card receipt"><span class="eb">✓ Mock AI 인증 승인</span><h1 class="section-title" style="margin-top:12px">환경 영수증</h1><p class="muted">${r.p.name}에서 남긴 오늘의 좋은 변화</p><dl><dt>완료 미션</dt><dd>${r.m.title}</dd><dt>수거 쓰레기</dt><dd>${r.n}개</dd><dt>이동 거리</dt><dd>${r.dist||100}m</dd><dt>구역 청정도</dt><dd>${r.before} → ${r.after}</dd><dt>획득 Drop</dt><dd style="color:#0872ec">+${r.reward} Drop</dd><dt>해금 혜택</dt><dd>해변 카페 10% 할인</dd></dl></section><div class="card" style="margin-top:15px"><b>다음 추천 · 민락수변공원 산책 코스</b><p class="muted">여유로운 해변 구간을 따라 다음 플로깅을 이어가 보세요.</p></div><button class="primary" style="width:100%;margin-top:15px" onclick="resetEco()">다음 미션 찾기</button></main>${nav()}`};const old=window.initMap;window.initMap=function(){old();setTimeout(()=>Object.entries(E().zones).forEach(([d,z],i)=>{let p=places.find(x=>x.district===d);if(p&&window.L)L.circle([p.lat,p.lng],{radius:650+i*80,color:z.clean<50?'#e54a4a':z.clean<65?'#e8ac27':'#16a979',fillOpacity:.18}).addTo(map).bindTooltip(`${d} · 청정도 ${z.clean} · ${z.bonus}배 보너스`) }),500)}})();
</script>

window.home=function(){let moods=['사람이 적은 바다','노을이 예쁜 곳','사진이 잘 나오는 곳','조용히 걷기 좋은 길','이색적인 카페','비 오는 날 가기 좋은 곳','반려동물과 가기 좋은 곳','아이와 가기 좋은 곳','혼자 쉬기 좋은 곳','무료로 즐길 곳','야경이 좋은 곳','대중교통이 편한 곳'];let times=['15분','30분','1시간','2시간','반나절','상관 없음'];let list=rec();return `<main class="page">${appHeader()}<section class="intro"><p>부산의 지금을 읽는 여행</p><h1>오늘, 어떤 부산을<br>찾고 있나요?</h1><div class="choice-title">원하는 분위기</div><div class="chips">${moods.map(m=>`<button class="chip ${S.mood===m?'on':''}" onclick="pickMood('${m}',this)">${m}</button>`).join('')}</div><input class="custom-box" id="customMood" placeholder="기타: 원하는 분위기나 장소를 직접 입력" value="${S.customMood||''}" onchange="S.customMood=this.value;S.mood=this.value||S.mood;save();render()"><div class="choice-title">이동 가능한 시간</div><div class="chips">${times.map(t=>`<button class="chip ${S.time===t?'on':''}" onclick="pickTime('${t}',this)">${t}</button>`).join('')}</div><input class="custom-box" id="customTime" placeholder="기타: 예) 45분, 오후 6시 이후" value="${S.customTime||''}" onchange="S.customTime=this.value;save();render()"></section><section class="results"><h2 class="section-title">${S.mood}에 맞는 추천</h2><p class="tiny">선택한 분위기와 이동 시간을 바꾸면 추천 결과도 즉시 갱신됩니다.</p><div class="grid">${list.map(placeCard).join('')}</div></section></main>${nav()}`};
window.chooseRoute=function(i){S.route={i,progress:0};S.view='navigate';save();render()};window.acceptEco=function(id){let e=E();e.session={id,at:Date.now(),checked:false,photo:false,distance:0,trash:{'플라스틱':0,'캔':0,'담배꽁초':0,'기타':0}};let m=M().find(x=>x.id===id);S.destination=m.place;S.route={i:1,eco:true};S.view='navigate';save();render()};
function liveMap(target,title,onArrive){setTimeout(()=>{let el=document.getElementById('navmap');if(!el||!window.L)return;routeMap=L.map(el,{zoomControl:false}).setView([35.145,129.06],13);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OpenStreetMap'}).addTo(routeMap);let dest=L.latLng(target.lat,target.lng),start=L.latLng(35.151,129.075);let line=L.polyline([start,dest],{color:'#1677ff',weight:7,opacity:.9}).addTo(routeMap);routeMe=L.marker(start,{icon:L.divIcon({className:'',html:'<div style="width:18px;height:18px;background:#1677ff;border:4px solid white;border-radius:50%;box-shadow:0 1px 7px #123"></div>',iconSize:[18,18]})}).addTo(routeMap);L.marker(dest).addTo(routeMap).bindPopup(title).openPopup();routeMap.fitBounds(line.getBounds(),{padding:[35,35]});let update=pos=>{let p=L.latLng(pos.coords.latitude,pos.coords.longitude);routeMe.setLatLng(p);line.setLatLngs([p,dest]);routeMap.panTo(p);document.getElementById('gpsState').textContent='현재 위치를 따라 안내 중';};if(navigator.geolocation){routeWatch=navigator.geolocation.watchPosition(update,()=>{document.getElementById('gpsState').textContent='Mock 위치로 안내 중';},{enableHighAccuracy:true,maximumAge:5000})}else document.getElementById('gpsState').textContent='Mock 위치로 안내 중';window.simulateMove=()=>{let p=routeMe.getLatLng(),n=L.latLng(p.lat+(dest.lat-p.lat)*.25,p.lng+(dest.lng-p.lng)*.25);routeMe.setLatLng(n);line.setLatLngs([n,dest]);routeMap.panTo(n);document.getElementById('gpsState').textContent='개발용 위치 이동 완료';};},0)}
window.navigate=function(){let eco=S.route?.eco, target=eco?places.find(x=>x.id===E().session.id&&false):places.find(x=>x.id===S.destination);if(eco){let m=M().find(x=>x.id===E().session.id);target=places.find(x=>x.id===m.place)}target=target||places[3];let title=eco?'플로깅 미션 장소: '+target.name:target.name+' 우회 루트';let r=routes[S.route?.i||1];setTimeout(()=>liveMap(target,title),0);return `<main class="page">${appHeader()}<h1 class="section-title">${eco?'미션 장소로 안내 중':'우회 루트 안내 중'}</h1><div class="route-banner"><b id="gpsState">현재 위치를 찾는 중…</b><div class="tiny" style="color:#dceaff;margin-top:4px">${title} · 실제 위치가 반영되면 파란 경로가 갱신됩니다.</div></div><div id="navmap" class="navmap"></div><div class="metrics" style="margin-top:12px"><div class="metric">다음 지점<b>420m</b></div><div class="metric">예상 시간<b>${eco?'12':r[1]}분</b></div><div class="metric">현재 혼잡<b>${eco?'낮음':r[3]}</b></div></div><button class="soft" style="width:100%;margin-top:12px" onclick="simulateMove()">개발용: 현재 위치 이동</button><button class="primary" style="width:100%;margin-top:10px" onclick="${eco?"S.view='report';save();render()":"go('my')"}">${eco?'현장 도착 · 미션 시작':'루트 종료'}</button></main>${nav()}`};
window.rewards=function(){let e=E(),items=[['☕','해변 카페 음료 10% 할인',40],['🥤','편의점 음료 1,000원 할인',60],['🍪','로컬 베이커리 쿠키 증정',90],['🎫','부산 관광 굿즈 15% 할인',150]];return `<main class="page">${appHeader()}<h1 class="section-title">Drop 리워드 교환</h1><p class="muted">플로깅으로 모은 Drop을 부산 지역 혜택으로 바꿔보세요.</p><div class="card" style="margin:16px 0"><b style="font-size:25px;color:#0872ec">💧 ${e.drops} Drop</b><p class="tiny">현재 교환 가능한 지역 혜택이에요.</p></div><div class="em">${items.map((x,i)=>`<article class="card reward-card"><div class="reward-icon">${x[0]}</div><div style="flex:1"><b>${x[1]}</b><p class="tiny">${x[2]} Drop 필요 · 근처 매장에서 사용</p></div><button class="primary" ${e.drops<x[2]?'disabled':''} onclick="redeemReward(${x[2]},'${x[1]}')">교환</button></article>`).join('')}</div></main>${nav()}`};window.redeemReward=function(cost,name){let e=E();if(e.drops<cost)return;e.drops-=cost;e.coupons=e.coupons||[];e.coupons.push(name);save();toast(name+' 쿠폰을 발급했어요. 마이 화면에서 확인할 수 있어요.');render()};
window.render=function(){let pages={home,map:mapView,routes:routesView,navigate,report,rewards,my};document.getElementById('app').innerHTML=(pages[S.view]||home)();if(S.view==='map')initMap()};render();})();

<script>window.M=()=>S.env?.ms||[];window.rec=()=>{let q=(S.customMood||S.mood||'').replace(/\s/g,'');return [...places].map(p=>({p,s:(100-pressure(p))+((p.name+p.district+p.moods.join('')).replace(/\s/g,'').includes(q.slice(0,2))?55:0)+((q.includes('바다')&&p.moods.some(x=>x.includes('바다')))?35:0)+((q.includes('카페')&&p.moods.some(x=>x.includes('카페')))?35:0)+((q.includes('사진')&&p.moods.some(x=>x.includes('사진')))?35:0)+((q.includes('조용')&&p.moods.some(x=>x.includes('조용')||x.includes('걷기')))?35:0)})).sort((a,b)=>b.s-a.s).slice(0,3).map(x=>x.p)};render();</script>
<script>window.rec=()=>{let q=(S.customMood||S.mood||'').replace(/\s/g,''),tm={'15분':15,'30분':30,'1시간':60,'2시간':120,'반나절':240,'상관 없음':999}[S.time]||60;return [...places].map(p=>{let mood=(p.name+p.district+p.moods.join('')).replace(/\s/g,''),match=mood.includes(q.slice(0,2))?55:0;['바다','카페','사진','조용','걷기','노을'].forEach(k=>{if(q.includes(k)&&mood.includes(k))match+=30});return{p,s:100-pressure(p)+match-(p.base>tm?45:0)}}).sort((a,b)=>b.s-a.s).slice(0,3).map(x=>x.p)};if(S.view==='home')render();</script>
<script>
(()=>{let navMap,navLine,userMarker,watchId,lastRouteAt=0;const modeInfo={walk:{label:'도보',icon:'🚶',speed:4.5},car:{label:'차량',icon:'🚗',speed:32},subway:{label:'지하철',icon:'🚇',speed:24}};function km(a,b){let r=Math.PI/180,d1=(b.lat-a.lat)*r,d2=(b.lng-a.lng)*r,x=Math.sin(d1/2)**2+Math.cos(a.lat*r)*Math.cos(b.lat*r)*Math.sin(d2/2)**2;return 12742*Math.atan2(Math.sqrt(x),Math.sqrt(1-x))}function mins(distance,mode){let n=Math.max(3,Math.round(distance/modeInfo[mode].speed*60));return mode==='subway'?n+8:n}function clearWatch(){if(watchId)navigator.geolocation.clearWatch(watchId);watchId=null}function routeUrl(a,b){return `https://router.project-osrm.org/route/v1/driving/${a.lng},${a.lat};${b.lng},${b.lat}?overview=full&geometries=geojson`}async function paintRoute(from,to,mode){let status=document.getElementById('gpsState'),distance=km(from,to),duration=mins(distance,mode),coords;status.textContent='실제 도로 경로를 계산 중…';try{let res=await fetch(routeUrl(from,to));if(!res.ok)throw 0;let data=await res.json();coords=data.routes[0].geometry.coordinates.map(x=>[x[1],x[0]]);let carMin=Math.max(2,Math.round(data.routes[0].duration/60));duration=mode==='car'?carMin:mode==='walk'?Math.max(4,Math.round(carMin*5.2)):Math.max(8,Math.round(carMin*2.1+6));}catch(e){status.textContent='경로 서버에 연결하지 못했습니다. 위치는 계속 추적 중입니다.';return}if(navLine)navMap.removeLayer(navLine);navLine=L.polyline(coords,{color:mode==='subway'?'#6b55d9':mode==='car'?'#ec7d24':'#1677ff',weight:7,dashArray:mode==='subway'?'10 9':null,lineJoin:'round'}).addTo(navMap);navMap.fitBounds(navLine.getBounds(),{padding:[35,35]});document.getElementById('eta').textContent=duration+'분';document.getElementById('distance').textContent=distance.toFixed(1)+'km';status.textContent=`GPS 위치를 따라 ${modeInfo[mode].label} 경로를 갱신 중`;if(mode==='subway')document.getElementById('transportDetail').textContent='도보 이동 + 지하철 환승을 포함한 예상 시간';else document.getElementById('transportDetail').textContent=mode==='walk'?'보행 속도를 반영한 예상 시간':'현재 도로 경로 기준 예상 시간'}function navigationMap(target,mode){setTimeout(()=>{let el=document.getElementById('navmap');if(!el||!window.L)return;clearWatch();navMap=L.map(el,{zoomControl:false}).setView([target.lat,target.lng],13);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OpenStreetMap'}).addTo(navMap);L.marker([target.lat,target.lng]).addTo(navMap).bindPopup('목적지 · '+target.name).openPopup();let usePosition=pos=>{let from={lat:pos.coords.latitude,lng:pos.coords.longitude};if(km(from,target)>120){document.getElementById('gpsState').textContent='현재 위치가 부산에서 멀어, 목적지 주변 지도만 표시합니다.';return}if(!userMarker)userMarker=L.marker([from.lat,from.lng],{icon:L.divIcon({className:'',html:'<div style="width:19px;height:19px;border-radius:50%;background:#1677ff;border:4px solid white;box-shadow:0 1px 8px #123"></div>',iconSize:[19,19]})}).addTo(navMap).bindTooltip('내 위치');else userMarker.setLatLng([from.lat,from.lng]);if(Date.now()-lastRouteAt>8000){lastRouteAt=Date.now();paintRoute(from,target,mode)}};if(!navigator.geolocation){document.getElementById('gpsState').textContent='이 브라우저에서는 위치 정보를 사용할 수 없습니다.';return}navigator.geolocation.getCurrentPosition(usePosition,()=>{document.getElementById('gpsState').textContent='위치 권한을 허용하면 실제 GPS 안내가 시작됩니다.'},{enableHighAccuracy:true,timeout:8000});watchId=navigator.geolocation.watchPosition(usePosition,()=>{}, {enableHighAccuracy:true,maximumAge:4000,timeout:15000});},0)}window.setTransport=function(m){S.transport=m;save();render()};window.navigate=function(){let eco=S.route?.eco,target;if(eco){let m=M().find(x=>x.id===E().session.id);target=places.find(x=>x.id===m.place)}else target=places.find(x=>x.id===S.destination);target=target||places[3];let mode=S.transport||'walk';setTimeout(()=>navigationMap(target,mode),0);return `<main class="page">${appHeader()}<h1 class="section-title">${eco?'플로깅 장소로 안내':'우회 루트 안내'}</h1><p class="muted">출발점은 브라우저 GPS 위치이며, 이동할 때마다 경로가 다시 계산됩니다.</p><div class="chips" style="margin:13px 0">${Object.entries(modeInfo).map(([k,v])=>`<button class="chip ${mode===k?'on':''}" onclick="setTransport('${k}')">${v.icon} ${v.label}</button>`).join('')}</div><div class="route-banner"><b id="gpsState">GPS 위치 권한을 확인 중…</b><div id="transportDetail" class="tiny" style="color:#dceaff;margin-top:5px">선택한 이동 수단에 맞는 경로를 계산합니다.</div></div><div id="navmap" class="navmap"></div><div class="metrics" style="margin-top:12px"><div class="metric">목적지까지<b id="distance">계산 중</b></div><div class="metric">예상 시간<b id="eta">계산 중</b></div><div class="metric">이동 수단<b>${modeInfo[mode].label}</b></div></div><button class="primary" style="width:100%;margin-top:12px" onclick="${eco?"S.view='report';save();render()":"go('my')"}">${eco?'현장 도착 · 미션 시작':'루트 종료'}</button></main>${nav()}`};window.render=function(){let pages={home,map:mapView,routes:routesView,navigate,report,rewards,my};document.getElementById('app').innerHTML=(pages[S.view]||home)();if(S.view==='map')initMap()};render()})();
</script>
<script>
(()=>{let lm,line,me,watch,activeMode='walk';function ptDistance(a,b){const r=Math.PI/180,x=(b.lat-a.lat)*r,y=(b.lng-a.lng)*r,z=Math.sin(x/2)**2+Math.cos(a.lat*r)*Math.cos(b.lat*r)*Math.sin(y/2)**2;return 12742*Math.atan2(Math.sqrt(z),Math.sqrt(1-z))}function getTarget(){return places.find(p=>p.id===S.destination)||places[3]}function routeEndpoint(a,b){return `https://router.project-osrm.org/route/v1/driving/${a.lng},${a.lat};${b.lng},${b.lat}?overview=full&geometries=geojson&steps=true`}function navPage(){let target=getTarget(),m=activeMode;return `<main class="page"><header class="top"><button class="logo" onclick="go('home')">Blue<i>Drop</i></button><button class="reward-btn" onclick="go('rewards')">🎁 ${(S.env&&S.env.drops)||0} Drop · 교환</button></header><h1 class="section-title">GPS 경로 안내</h1><p class="muted">내 현재 위치에서 ${target.name}까지 실제 도로망을 따라 안내합니다.</p><div class="chips" style="margin:13px 0"><button class="chip ${m==='walk'?'on':''}" onclick="forceMode('walk')">🚶 도보</button><button class="chip ${m==='car'?'on':''}" onclick="forceMode('car')">🚗 차량</button><button class="chip ${m==='subway'?'on':''}" onclick="forceMode('subway')">🚇 지하철</button></div><div class="route-banner"><b id="realGpsState">GPS 위치를 요청하고 있어요…</b><div class="tiny" id="realGpsDetail" style="color:#dceaff;margin-top:5px">위치 권한이 허용되면 실제 도로 경로를 계산합니다.</div></div><div id="realNavigationMap" class="navmap"></div><div class="metrics" style="margin-top:12px"><div class="metric">목적지까지<b id="realDistance">계산 중</b></div><div class="metric">예상 시간<b id="realEta">계산 중</b></div><div class="metric">선택 수단<b>${m==='walk'?'도보':m==='car'?'차량':'지하철'}</b></div></div><button class="primary" style="width:100%;margin-top:14px" onclick="go('map')">지도 전체 보기</button></main>${nav()}`}async function drawRoad(from,target){let state=document.getElementById('realGpsState'),detail=document.getElementById('realGpsDetail'),distance=ptDistance(from,target);state.textContent='실제 도로 경로를 분석 중…';try{let response=await fetch(routeEndpoint(from,target));if(!response.ok)throw new Error();let json=await response.json(),road=json.routes[0],coords=road.geometry.coordinates.map(c=>[c[1],c[0]]);if(line)lm.removeLayer(line);let color=activeMode==='walk'?'#1677ff':activeMode==='car'?'#f06d2f':'#6b55d9';line=L.polyline(coords,{color,weight:7,opacity:.94,dashArray:activeMode==='subway'?'12 8':null,lineJoin:'round'}).addTo(lm);lm.fitBounds(line.getBounds(),{padding:[35,35]});let car=Math.max(2,Math.round(road.duration/60)),eta=activeMode==='car'?car:activeMode==='walk'?Math.round(car*4.8):Math.round(car*2+7);document.getElementById('realDistance').textContent=(road.distance/1000).toFixed(1)+'km';document.getElementById('realEta').textContent=eta+'분';state.textContent='GPS 위치를 따라 경로를 안내 중';detail.textContent=activeMode==='subway'?'도로 접근 구간과 지하철 이동을 합산한 예상 시간입니다.':activeMode==='walk'?'도로망을 기준으로 한 보행 예상 경로입니다.':'실제 도로망 기준 차량 경로입니다.'}catch(e){state.textContent='도로 경로를 불러오지 못했습니다.';detail.textContent='인터넷 연결을 확인한 뒤 다시 시도해 주세요. 직선 경로로 대체하지 않습니다.'}}function startRealNavigation(){setTimeout(()=>{let target=getTarget(),el=document.getElementById('realNavigationMap');if(!el||!window.L)return;if(watch)navigator.geolocation.clearWatch(watch);lm=L.map(el,{zoomControl:false}).setView([target.lat,target.lng],13);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OpenStreetMap'}).addTo(lm);L.marker([target.lat,target.lng]).addTo(lm).bindPopup('목적지 · '+target.name).openPopup();if(!navigator.geolocation){document.getElementById('realGpsState').textContent='이 브라우저는 GPS를 지원하지 않습니다.';return}let updated=0,loc=pos=>{let now=Date.now(),from={lat:pos.coords.latitude,lng:pos.coords.longitude};if(!me)me=L.marker([from.lat,from.lng],{icon:L.divIcon({className:'',html:'<div style="width:20px;height:20px;background:#1677ff;border:4px solid #fff;border-radius:50%;box-shadow:0 2px 9px #123"></div>',iconSize:[20,20]})}).addTo(lm).bindTooltip('내 위치');else me.setLatLng([from.lat,from.lng]);if(now-updated>7000){updated=now;drawRoad(from,target)}};watch=navigator.geolocation.watchPosition(loc,()=>{document.getElementById('realGpsState').textContent='위치 정보를 받지 못했습니다.';document.getElementById('realGpsDetail').textContent='주소창 왼쪽 설정에서 위치를 허용하고 새로고침해 주세요.'},{enableHighAccuracy:true,maximumAge:3000,timeout:12000});},0)}window.forceMode=m=>{activeMode=m;forceNavigation()};window.forceNavigation=()=>{if(S.view!=='navigate')return;document.getElementById('app').innerHTML=navPage();startRealNavigation()};let timer=setInterval(()=>{if(S.view==='navigate'&&!document.getElementById('realNavigationMap'))forceNavigation()},200);window.addEventListener('beforeunload',()=>{clearInterval(timer);if(watch)navigator.geolocation.clearWatch(watch)});})();
</script>
<script>
(()=>{let plannerMap,plannerLine;function targetPlace(){return places.find(p=>p.id===S.destination)||places[3]}function placeOptions(){return places.map(p=>`<option value="${p.name}">${p.district}</option>`).join('')}async function resolveOrigin(text){let found=places.find(p=>p.name===text);if(found)return found;let response=await fetch('https://nominatim.openstreetmap.org/search?format=jsonv2&limit=1&q='+encodeURIComponent(text+' 부산'));let data=await response.json();if(!data.length)throw Error('not-found');return{name:data[0].display_name,lat:+data[0].lat,lng:+data[0].lon}}async function drawPlanner(origin,destination,mode){let note=document.getElementById('plannerNote');note.textContent='실제 도로 경로를 계산하고 있어요…';try{let url=`https://router.project-osrm.org/route/v1/driving/${origin.lng},${origin.lat};${destination.lng},${destination.lat}?overview=full&geometries=geojson`;let res=await fetch(url);if(!res.ok)throw Error();let data=await res.json(),route=data.routes[0],coords=route.geometry.coordinates.map(c=>[c[1],c[0]]);if(plannerLine)plannerMap.removeLayer(plannerLine);plannerLine=L.polyline(coords,{color:mode==='car'?'#f06d2f':mode==='subway'?'#6b55d9':'#1677ff',weight:7,dashArray:mode==='subway'?'12 8':null,lineJoin:'round'}).addTo(plannerMap);plannerMap.fitBounds(plannerLine.getBounds(),{padding:[35,35]});let car=Math.max(2,Math.round(route.duration/60)),eta=mode==='car'?car:mode==='walk'?Math.round(car*4.8):Math.round(car*2+7);document.getElementById('plannerDistance').textContent=(route.distance/1000).toFixed(1)+'km';document.getElementById('plannerEta').textContent=eta+'분';note.textContent='실제 도로망을 따라 계산된 경로입니다.'}catch(e){note.textContent='경로를 찾지 못했습니다. 출발 장소 이름을 다시 입력해 주세요.'}}function startPlanner(origin,destination,mode){setTimeout(()=>{let el=document.getElementById('realNavigationMap');if(!el||!window.L)return;plannerMap=L.map(el,{zoomControl:false}).setView([destination.lat,destination.lng],13);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OpenStreetMap'}).addTo(plannerMap);L.marker([origin.lat,origin.lng]).addTo(plannerMap).bindPopup('출발 · '+origin.name).openPopup();L.marker([destination.lat,destination.lng]).addTo(plannerMap).bindPopup('도착 · '+destination.name);drawPlanner(origin,destination,mode)},0)}function plannerPage(){let destination=targetPlace(),mode=S.transport||'walk',origin=S.routeOrigin;return `<main class="page"><header class="top"><button class="logo" onclick="go('home')">Blue<i>Drop</i></button><button class="reward-btn" onclick="go('rewards')">🎁 ${(S.env&&S.env.drops)||0} Drop · 교환</button></header><h1 class="section-title">장소 간 경로 안내</h1><p class="muted">도착지는 선택한 관광지로 자동 설정됩니다. 출발지만 입력해 주세요.</p><div class="card" style="margin:14px 0"><label class="tiny">출발 위치</label><div style="display:flex;gap:8px;margin-top:7px"><input id="originText" list="originPlaces" class="field" value="${S.originText||''}" placeholder="예: 부산역, 해운대역, 송정 죽도공원"><datalist id="originPlaces">${placeOptions()}</datalist><button class="primary" style="white-space:nowrap" onclick="setPlannerOrigin()">경로 찾기</button></div><p class="tiny" style="margin:8px 0 0">도착 위치 · <b>${destination.name}</b></p></div><div class="chips" style="margin:10px 0">${[['walk','🚶 도보'],['car','🚗 차량'],['subway','🚇 지하철']].map(x=>`<button class="chip ${mode===x[0]?'on':''}" onclick="S.transport='${x[0]}';save();plannerNavigation()">${x[1]}</button>`).join('')}</div>${origin?`<div class="route-banner"><b id="plannerNote">경로를 준비 중이에요…</b><div class="tiny" style="color:#dceaff;margin-top:5px">${origin.name} → ${destination.name}</div></div><div id="realNavigationMap" class="navmap"></div><div class="metrics" style="margin-top:12px"><div class="metric">거리<b id="plannerDistance">계산 중</b></div><div class="metric">예상 시간<b id="plannerEta">계산 중</b></div><div class="metric">이동 수단<b>${mode==='walk'?'도보':mode==='car'?'차량':'지하철'}</b></div></div>`:`<div class="card empty">출발 위치를 입력하고 “경로 찾기”를 눌러 주세요.</div>`}<button class="primary" style="width:100%;margin-top:14px" onclick="go('map')">지도 전체 보기</button></main>${nav()}`}window.setPlannerOrigin=async function(){let input=document.getElementById('originText'),text=input.value.trim();if(!text)return toast('출발 위치를 입력해 주세요.');try{S.routeOrigin=await resolveOrigin(text);S.originText=text;save();plannerNavigation()}catch(e){toast('출발 위치를 찾지 못했습니다. 장소 이름을 더 자세히 입력해 주세요.')}};window.plannerNavigation=function(){if(S.view!=='navigate')return;document.getElementById('app').innerHTML=plannerPage();if(S.routeOrigin)startPlanner(S.routeOrigin,targetPlace(),S.transport||'walk')};let plannerTimer=setInterval(()=>{if(S.view==='navigate'&&!document.getElementById('plannerDistance'))plannerNavigation()},250);window.addEventListener('beforeunload',()=>clearInterval(plannerTimer));})();
</script>

<script>
(()=>{let originMap,originPath;function destination(){return places.find(p=>p.id===S.destination)||places[3]}function originPanel(){let target=destination(),opts=places.map(p=>`<option value="${p.name}">`).join('');return `<section id="originPlanner" class="card" style="margin:0 0 16px"><b style="font-size:17px">출발 위치를 입력하세요</b><p class="tiny" style="margin:5px 0 10px">도착지는 <b>${target.name}</b>으로 자동 설정됩니다.</p><div style="display:flex;gap:7px"><input id="originPlannerInput" list="originPlannerList" class="field" placeholder="예: 부산역, 해운대역" value="${S.originText||''}"><datalist id="originPlannerList">${opts}</datalist><button class="primary" style="white-space:nowrap" onclick="planFromInput()">안내 시작</button></div><p id="originPlannerMessage" class="tiny" style="margin:9px 0 0">출발 장소를 입력하면 실제 도로 경로를 표시합니다.</p><div id="originPlannerMap" class="navmap" style="height:280px;margin-top:10px"></div></section>`}async function findOrigin(text){let known=places.find(p=>p.name===text);if(known)return known;let r=await fetch('https://nominatim.openstreetmap.org/search?format=jsonv2&limit=1&q='+encodeURIComponent(text+' 부산'));let a=await r.json();if(!a.length)throw Error();return{name:a[0].display_name,lat:+a[0].lat,lng:+a[0].lon}}async function road(origin,target){let msg=document.getElementById('originPlannerMessage');msg.textContent='실제 도로를 따라 경로를 분석 중…';try{let u=`https://router.project-osrm.org/route/v1/driving/${origin.lng},${origin.lat};${target.lng},${target.lat}?overview=full&geometries=geojson`;let res=await fetch(u),data=await res.json(),route=data.routes[0],points=route.geometry.coordinates.map(x=>[x[1],x[0]]);if(originPath)originMap.removeLayer(originPath);originPath=L.polyline(points,{color:'#1677ff',weight:7,lineJoin:'round'}).addTo(originMap);originMap.fitBounds(originPath.getBounds(),{padding:[28,28]});msg.textContent=`${origin.name}에서 ${target.name}까지 ${(route.distance/1000).toFixed(1)}km 도로 경로를 표시했어요.`}catch(e){msg.textContent='경로를 찾지 못했습니다. 출발 장소 이름을 더 자세히 입력해 주세요.'}}function createPlanner(){let host=document.getElementById('app');if(!host||document.getElementById('originPlanner'))return;let anchor=host.querySelector('.page');if(!anchor)return;anchor.insertAdjacentHTML('afterbegin',originPanel());let el=document.getElementById('originPlannerMap');originMap=L.map(el,{zoomControl:false}).setView([35.1151,129.0414],12);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OpenStreetMap'}).addTo(originMap);L.marker([destination().lat,destination().lng]).addTo(originMap).bindPopup('도착 · '+destination().name).openPopup()}window.planFromInput=async()=>{let text=document.getElementById('originPlannerInput').value.trim();if(!text)return toast('출발 위치를 입력해 주세요.');try{let o=await findOrigin(text);S.originText=text;S.routeOrigin=o;save();L.marker([o.lat,o.lng]).addTo(originMap).bindPopup('출발 · '+o.name).openPopup();road(o,destination())}catch(e){document.getElementById('originPlannerMessage').textContent='출발 위치를 찾지 못했습니다. 예: 부산역, 해운대역처럼 입력해 주세요.'}};setInterval(()=>{if(S.view==='navigate')createPlanner()},150)})();
</script>
<script>
(()=>{document.head.insertAdjacentHTML('beforeend','<style>.blue-coupon-wallet{margin:14px 0}.blue-coupon-row{display:flex;gap:10px;align-items:center;padding:12px 0;border-top:1px solid #e5edf2}.blue-coupon-row:first-of-type{border-top:0}.blue-coupon-icon{font-size:22px;background:#e7f3ff;border-radius:12px;padding:9px}</style>');function wallet(){if(S.view!=='my'||document.getElementById('blueCouponWallet'))return;let page=document.querySelector('#app .page');if(!page)return;let coupons=(S.env&&S.env.coupons)||[];let rows=coupons.length?coupons.map(c=>`<div class="blue-coupon-row"><span class="blue-coupon-icon">&#127915;</span><div style="flex:1"><b>${c}</b><p class="tiny" style="margin:3px 0 0">BlueDrop reward coupon</p></div><span class="pill">Available</span></div>`).join(''):'<p class="tiny" style="margin:10px 0 0">No coupons yet. Redeem a Drop reward to save it here.</p>';page.insertAdjacentHTML('afterbegin',`<section id="blueCouponWallet" class="card blue-coupon-wallet"><div style="display:flex;justify-content:space-between"><b>&#127915; &#52968;&#54256;&#54632; / Coupon wallet</b><span class="tiny">${coupons.length} saved</span></div>${rows}</section>`)}setInterval(wallet,250);setTimeout(wallet,20)})();

<script>
(()=>{document.head.insertAdjacentHTML('beforeend','<style>.my-coupon-vault{margin:14px 0}.my-coupon-item{display:flex;align-items:center;gap:10px;padding:12px 0;border-top:1px solid #e5edf2}.my-coupon-item:first-of-type{border-top:0}</style>');function adjustMy(){if(S.view!=='my')return;let page=document.querySelector('#app .page');if(!page)return;page.querySelectorAll('.stat').forEach(x=>{let q=x.textContent||'';if(q.includes('나눠')||q.includes('저장한'))x.remove()});let old=document.getElementById('blueCouponWallet');if(old)old.remove();if(document.getElementById('myCouponVault'))return;let coupons=(S.env&&S.env.coupons)||[];let content=coupons.length?coupons.map(c=>`<div class="my-coupon-item"><span style="font-size:23px">&#127915;</span><div style="flex:1"><b>${c}</b><p class="tiny" style="margin:3px 0 0">Reward coupon saved in BlueDrop</p></div><span class="pill">Available</span></div>`).join(''):'<p class="tiny" style="margin:10px 0 0">Redeem a reward and your coupon will be saved here.</p>';page.insertAdjacentHTML('afterbegin',`<section id="myCouponVault" class="card my-coupon-vault"><div style="display:flex;justify-content:space-between"><b>&#127915; &#52968;&#54256;&#54632; / Coupon wallet</b><span class="tiny">${coupons.length} saved</span></div>${content}</section>`)}setInterval(adjustMy,180);setTimeout(adjustMy,20)})();
</script>
<script>
(()=>{document.head.insertAdjacentHTML('beforeend','<style>#blueCouponWallet,#myCouponVault{display:none!important}.serial-vault{margin:14px 0}.serial-coupon{padding:15px 0;border-top:1px solid #e3ebf1}.serial-coupon:first-of-type{border-top:0}.serial-code{display:flex;align-items:center;justify-content:space-between;gap:8px;background:#edf6ff;border:1px dashed #73adf1;border-radius:11px;padding:10px;margin:9px 0;font-family:Consolas,monospace;font-weight:900;letter-spacing:1px;color:#075fc8}.serial-actions{display:flex;gap:7px}.serial-actions button{flex:1}</style>');function couponCode(){let a=new Uint8Array(5);if(window.crypto&&crypto.getRandomValues)crypto.getRandomValues(a);else for(let i=0;i<a.length;i++)a[i]=Math.random()*256;let x=Array.from(a,b=>b.toString(36).padStart(2,'0')).join('').toUpperCase();let y=String(new Date().getFullYear()).slice(-2);return `BD-${y}-${x.slice(0,4)}-${x.slice(4,8)}`}function syncRecords(){let e=S.env||(S.env={}),coupons=e.coupons||(e.coupons=[]),records=e.couponRecords||(e.couponRecords=[]);while(records.length<coupons.length){let i=records.length;records.push({name:coupons[i],code:couponCode(),issuedAt:Date.now()})}if(records.length>coupons.length)records.splice(coupons.length);save();return records}function drawVault(){if(S.view!=='my')return;let page=document.querySelector('#app .page');if(!page)return;let records=syncRecords(),old=document.getElementById('couponSerialVault');if(old)old.remove();let rows=records.length?records.map((r,i)=>`<article class="serial-coupon"><div style="display:flex;justify-content:space-between;gap:8px"><b>${r.name}</b><span class="pill">사용 가능</span></div><p class="tiny" style="margin:5px 0">매장에서 아래 일련번호를 입력해 사용하세요.</p><div class="serial-code"><span>${r.code}</span><button class="soft" style="min-height:34px;padding:5px 8px" onclick="copyCouponCode('${r.code}')">복사</button></div><div class="serial-actions"><button class="outline" onclick="copyCouponCode('${r.code}')">번호 복사</button><button class="primary" onclick="useCoupon(${i})">사용 완료 · 삭제</button></div></article>`).join(''):'<p class="tiny" style="margin:12px 0 0">보관 중인 쿠폰이 없습니다. 리워드에서 쿠폰을 교환하면 일련번호가 자동 발급됩니다.</p>';page.insertAdjacentHTML('afterbegin',`<section id="couponSerialVault" class="card serial-vault"><div style="display:flex;justify-content:space-between;align-items:center"><b>🎟 쿠폰함</b><span class="tiny">${records.length}개 보관 중</span></div>${rows}</section>`)}window.copyCouponCode=async code=>{try{await navigator.clipboard.writeText(code);toast('쿠폰 일련번호를 복사했어요.')}catch(e){toast('쿠폰 번호: '+code)}};window.useCoupon=index=>{if(!confirm('매장에서 사용을 완료했나요? 사용 처리하면 쿠폰함에서 삭제됩니다.'))return;let e=S.env||{},records=e.couponRecords||[],coupons=e.coupons||[];records.splice(index,1);coupons.splice(index,1);save();toast('사용한 쿠폰을 쿠폰함에서 삭제했어요.');render()};setInterval(drawVault,220);setTimeout(drawVault,30)})();
</script>
<script>
(()=>{
  const seedKey='bluedrop_coupon_serial_seed_v1';
  try{
    const env=S.env||(S.env={});
    env.coupons=Array.isArray(env.coupons)?env.coupons:[];
    env.couponRecords=Array.isArray(env.couponRecords)?env.couponRecords:[];

    if(!localStorage.getItem(seedKey)&&env.coupons.length===0&&env.couponRecords.length===0){
      const firstCoupon={
        name:'해변 카페 음료 10% 할인',
        code:'BD-26-1T13-4X1S',
        issuedAt:Date.now()
      };
      env.coupons.push(firstCoupon.name);
      env.couponRecords.push(firstCoupon);
      save();
    }

    localStorage.setItem(seedKey,'1');

    window.copyCouponCode=async code=>{
      let copied=false;
      try{
        if(navigator.clipboard&&window.isSecureContext){
          await navigator.clipboard.writeText(code);
          copied=true;
        }
      }catch(error){}

      if(!copied){
        const field=document.createElement('textarea');
        field.value=code;
        field.setAttribute('readonly','');
        field.style.position='fixed';
        field.style.opacity='0';
        document.body.appendChild(field);
        field.select();
        copied=document.execCommand('copy');
        field.remove();
      }

      toast(copied?'쿠폰 일련번호를 복사했어요.':'쿠폰 번호: '+code);
    };

    let pendingCouponUse={index:-1,until:0};
    window.useCoupon=index=>{
      if(pendingCouponUse.index!==index||Date.now()>pendingCouponUse.until){
        pendingCouponUse={index,until:Date.now()+5000};
        const buttons=document.querySelectorAll('.serial-actions .primary');
        if(buttons[index])buttons[index].textContent='한 번 더 누르면 삭제';
        toast('매장에서 사용을 마쳤다면 한 번 더 눌러주세요.');
        return;
      }

      const records=env.couponRecords||[];
      const coupons=env.coupons||[];
      records.splice(index,1);
      coupons.splice(index,1);
      pendingCouponUse={index:-1,until:0};
      save();
      toast('사용한 쿠폰을 쿠폰함에서 삭제했어요.');
      render();
    };

    document.addEventListener('click',event=>{
      const button=event.target.closest&&event.target.closest('.serial-actions .primary');
      if(!button)return;
      const coupon=button.closest('.serial-coupon');
      const index=Array.from(document.querySelectorAll('.serial-coupon')).indexOf(coupon);
      if(index<0)return;
      event.preventDefault();
      event.stopImmediatePropagation();
      window.useCoupon(index);
    },true);
  }catch(error){
    console.warn('BlueDrop coupon initialization skipped.',error);
  }
})();
</script>
